<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>MTEJA AI · Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700;800;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════════════════
   MTEJA AI · RESPONSIVE v4.0
   Mobile-first. Desktop enhanced.
═══════════════════════════════════════════ */
:root{
  --forest:#053D2C; --lake:#065F46; --reed:#0D7A57; --wave:#10B981;
  --gold:#D97706;   --gold-l:#F59E0B; --sky:#0EA5E9;
  --moon:#F0FDF4;   --pebble:#E2E8F0; --dusk:#475569;
  --sidebar:240px;
}
@keyframes waveFlow{from{transform:translateX(0)}to{transform:translateX(33.33%)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,sans-serif;background:#f8fafc;min-height:100vh;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none}

/* ── MONEY FONT ── */
.num{font-family:'Inter',system-ui,sans-serif;font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum","lnum";letter-spacing:-0.5px}

/* ══════════════════════════════════════════
   LOGIN
══════════════════════════════════════════ */
#login{
  min-height:100vh;min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  padding:16px;position:relative;overflow:hidden;
  background:linear-gradient(170deg,var(--forest) 0%,var(--lake) 55%,#091a10 100%);
}
.l-star{position:absolute;width:2px;height:2px;border-radius:50%;
  background:#FCD34D;animation:shimmer 3s ease-in-out infinite}
.l-waves{position:absolute;bottom:0;left:-100%;width:300%;height:70px;pointer-events:none}
.lw{position:absolute;bottom:0;width:100%;height:100%;display:block}
.lw1{animation:waveFlow 9s linear infinite;opacity:.28}
.lw2{animation:waveFlow 13s linear -4s infinite;opacity:.5}
.lw3{animation:waveFlow 17s linear -8s infinite;opacity:.82}
.login-card{
  background:rgba(255,255,255,.97);border-radius:24px;
  padding:36px 28px 28px;width:100%;max-width:400px;
  box-shadow:0 32px 80px rgba(0,0,0,.4);
  position:relative;z-index:2;animation:fadeUp .6s cubic-bezier(.22,1,.36,1);
}
.login-logo-wrap{display:flex;justify-content:center;margin-bottom:16px}
.login-title{text-align:center;font-family:'Playfair Display',Georgia,serif;
  font-size:28px;font-weight:900;color:var(--forest);margin-bottom:3px}
.login-title .ai{color:var(--gold)}
.login-sub{text-align:center;color:var(--dusk);font-size:13px;margin-bottom:4px}
.login-tagline{text-align:center;font-size:11px;font-weight:700;color:var(--wave);
  letter-spacing:2px;text-transform:uppercase;margin-bottom:24px}
.login-card label{display:block;font-size:11px;font-weight:700;color:var(--dusk);
  letter-spacing:1px;margin-bottom:6px;text-transform:uppercase}
.login-card input{width:100%;padding:14px 16px;border:1.5px solid var(--pebble);
  border-radius:12px;font-size:16px;color:#0f172a;margin-bottom:14px;
  font-family:'Inter',system-ui;transition:border .2s;-webkit-appearance:none}
.login-card input:focus{outline:none;border-color:var(--lake);
  box-shadow:0 0 0 3px rgba(6,95,70,.1)}
.login-btn{width:100%;padding:16px;
  background:linear-gradient(135deg,var(--lake),var(--forest));
  color:#fff;border:none;border-radius:13px;font-size:16px;font-weight:700;
  cursor:pointer;transition:all .2s;box-shadow:0 6px 20px rgba(6,95,70,.3);
  font-family:'Inter',system-ui;letter-spacing:.3px}
.login-btn:active{transform:scale(.98)}
.login-msg{text-align:center;font-size:13px;margin-top:12px;min-height:18px}
.login-footer{text-align:center;font-size:11px;color:var(--dusk);margin-top:16px;opacity:.65}

/* ══════════════════════════════════════════
   APP SHELL
══════════════════════════════════════════ */
#app{display:none}

/* ══════════════════════════════════════════
   MOBILE LAYOUT (default — mobile first)
══════════════════════════════════════════ */
.sidebar{display:none}
.mobile-only{display:block}
.desk-only{display:none}

/* ── MOBILE TOP BAR ── */
.mob-bar{
  background:linear-gradient(135deg,var(--forest),var(--lake));
  color:#fff;padding:14px 16px 12px;
  position:sticky;top:0;z-index:100;
}
.mob-bar-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mob-brand{display:flex;align-items:center;gap:10px}
.mob-code{font-size:10px;color:#6ee7b7;font-weight:700;letter-spacing:2px;font-family:'DM Mono',monospace;margin-bottom:2px}
.mob-name{font-size:17px;font-weight:900;font-family:'Playfair Display',Georgia,serif;line-height:1.1;color:#fff}
.mob-type{font-size:11px;color:rgba(167,243,208,.8);margin-top:1px}
.mob-logout{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);
  color:#fff;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer}

/* ── MOBILE QUICK STATS ── */
.mob-qs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.mob-qs-box{background:rgba(255,255,255,.12);border-radius:10px;padding:10px 6px;text-align:center}
.mob-qs-val{font-size:18px;font-weight:900;color:#fff;font-family:'Inter',system-ui;
  font-variant-numeric:tabular-nums;line-height:1}
.mob-qs-lbl{font-size:9px;color:#6ee7b7;font-weight:600;margin-top:3px;letter-spacing:.5px;text-transform:uppercase}
.mob-bar-wave{height:32px;position:relative;overflow:hidden;margin:10px -16px -12px}
.mbw{position:absolute;bottom:0;width:300%;left:-100%;height:100%}
.mbw1{animation:waveFlow 9s linear infinite;opacity:.22}
.mbw2{animation:waveFlow 13s linear -4s infinite;opacity:.42}
.mbw3{animation:waveFlow 17s linear -8s infinite;opacity:.65}

/* ── MOBILE BOTTOM TABS ── */
.mob-tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:#fff;border-top:1px solid var(--pebble);
  display:flex;box-shadow:0 -4px 20px rgba(0,0,0,.08);
  padding-bottom:env(safe-area-inset-bottom);
}
.mob-tab{flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:10px 4px 8px;border:none;background:none;
  cursor:pointer;transition:all .15s;color:var(--dusk);font-family:'Inter',system-ui}
.mob-tab .ti{font-size:20px;margin-bottom:3px;transition:transform .2s}
.mob-tab .tl{font-size:10px;font-weight:600;letter-spacing:.2px}
.mob-tab.on{color:var(--lake)}
.mob-tab.on .ti{transform:translateY(-2px)}

/* ── PAGE CONTENT ── */
.page-wrap{padding:16px 14px 90px}
.page{display:none}
.page.on{display:block;animation:fadeUp .25s ease}

/* ── MOBILE STAT GRID (2×2) ── */
.mob-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.mob-stat{background:#fff;border-radius:14px;padding:16px 14px;
  border:1px solid var(--pebble);border-left:4px solid var(--c);
  box-shadow:0 2px 6px rgba(0,0,0,.04)}
.mob-stat-lbl{font-size:10px;color:#94a3b8;font-weight:700;letter-spacing:.8px;
  text-transform:uppercase;margin-bottom:6px}
.mob-stat-val{font-size:20px;font-weight:900;color:#0f172a;
  font-family:'Inter',system-ui;font-variant-numeric:tabular-nums;letter-spacing:-0.5px}
.mob-stat-sub{font-size:11px;color:var(--c);margin-top:4px;font-weight:600}

/* ── CARDS ── */
.card{background:#fff;border-radius:16px;padding:18px 16px;
  border:1px solid var(--pebble);margin-bottom:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card-title{font-size:15px;font-weight:800;color:#0f172a;margin-bottom:14px;
  font-family:'Playfair Display',Georgia,serif;
  display:flex;justify-content:space-between;align-items:center}
.card-count{font-size:13px;color:var(--lake);font-weight:700;font-family:'Inter',system-ui}

/* ── ROWS ── */
.row{display:flex;justify-content:space-between;align-items:center;
  padding:12px 0;border-bottom:1px solid #f8fafc}
.row:last-child{border:none}
.rn{font-size:14px;font-weight:700;color:#0f172a;font-family:'Playfair Display',Georgia,serif}
.ri{font-size:12px;color:#94a3b8;margin-top:2px}
.ra{font-size:15px;font-weight:800;color:var(--lake);
  font-family:'Inter',system-ui;font-variant-numeric:tabular-nums;letter-spacing:-0.3px}
.rp{font-size:11px;color:var(--gold-l);font-weight:700}

/* ── CUSTOMER CARDS ── */
.ccard{background:#fff;border-radius:14px;padding:15px;
  border:1px solid var(--pebble);margin-bottom:10px;
  box-shadow:0 2px 6px rgba(0,0,0,.04);transition:box-shadow .2s;
  animation:fadeUp .2s ease}
.cname{font-size:15px;font-weight:800;color:#0f172a;font-family:'Playfair Display',Georgia,serif}
.cphone{font-size:12px;color:var(--dusk);margin-top:2px}
.badge{border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700}
.cgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.cs{background:var(--moon);border-radius:9px;padding:9px 6px;text-align:center}
.csv{font-size:13px;font-weight:700;color:#0f172a;
  font-family:'Inter',system-ui;font-variant-numeric:tabular-nums}
.csl{font-size:10px;color:#94a3b8;margin-top:2px}
.c-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.c-call,.c-wa,.c-sms{
  padding:10px 6px;border-radius:10px;font-size:12px;font-weight:700;
  text-decoration:none;text-align:center;display:block;transition:opacity .2s}
.c-call{background:#eff6ff;color:#1d4ed8}
.c-wa{background:#dcfce7;color:#15803d}
.c-sms{background:#fef3c7;color:#92400e}
.c-call:active,.c-wa:active,.c-sms:active{opacity:.7}

/* ── SEARCH ── */
.srch{width:100%;padding:13px 16px;border-radius:12px;
  border:1.5px solid var(--pebble);font-size:16px;color:#0f172a;
  margin-bottom:14px;font-family:'Inter',system-ui;-webkit-appearance:none}
.srch:focus{outline:none;border-color:var(--lake);box-shadow:0 0 0 3px rgba(6,95,70,.1)}

/* ── FOLLOW-UP ── */
.fu-card{background:#fff;border-radius:14px;padding:16px;
  border-left:4px solid #ef4444;border:1px solid var(--pebble);
  margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.fu-msg{background:var(--moon);border-radius:10px;padding:12px 14px;
  font-size:13px;color:var(--lake);font-style:italic;margin:10px 0;
  border-left:3px solid var(--wave);line-height:1.6}
.wa-btn{display:block;text-align:center;background:#25D366;color:#fff;
  border-radius:12px;padding:13px;font-size:14px;font-weight:700;
  text-decoration:none;transition:opacity .15s}
.wa-btn:active{opacity:.85}
.empty{color:#94a3b8;font-size:14px;padding:32px 0;text-align:center}

/* ── BROADCAST ── */
.bc-seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.bc-seg-box{background:#fff;border-radius:12px;padding:14px 8px;
  text-align:center;border:1px solid var(--pebble)}
.bc-seg-val{font-size:22px;font-weight:900;font-family:'Inter',system-ui;font-variant-numeric:tabular-nums}
.bc-seg-lbl{font-size:10px;color:#94a3b8;margin-top:3px}
.tpl-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tpl-pill{padding:8px 14px;border-radius:20px;border:1px solid var(--pebble);
  background:var(--moon);font-size:12px;font-weight:700;color:var(--dusk);
  cursor:pointer;white-space:nowrap;transition:all .2s;-webkit-appearance:none}
.tpl-pill.sel{background:var(--lake);color:#fff;border-color:var(--lake)}
.compose-hint{font-size:11px;color:#94a3b8;margin-bottom:8px;line-height:1.5}
.compose-hint b{color:var(--lake)}
textarea{width:100%;padding:14px;border:1.5px solid var(--pebble);
  border-radius:12px;font-size:15px;font-family:'Inter',system-ui;
  resize:none;line-height:1.6;color:#0f172a;min-height:130px;-webkit-appearance:none}
textarea:focus{outline:none;border-color:var(--lake)}
.preview-box{background:linear-gradient(135deg,var(--moon),#d1fae5);
  border-radius:14px;padding:16px;margin-bottom:14px;border:1px solid #a7f3d0}
.preview-lbl{font-size:10px;font-weight:700;color:var(--lake);
  text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.preview-bubble{background:#fff;border-radius:0 12px 12px 12px;
  padding:14px 16px;font-size:14px;line-height:1.7;
  color:#0f172a;white-space:pre-wrap;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.wa-guide{background:#fff;border-radius:16px;border:1px solid var(--pebble);
  overflow:hidden;margin-bottom:14px}
.wa-guide-hd{background:linear-gradient(135deg,#25D366,#128C7E);padding:16px;color:#fff}
.wa-guide-title{font-size:15px;font-weight:800;font-family:'Playfair Display',Georgia,serif}
.wa-guide-sub{font-size:12px;opacity:.85;margin-top:2px}
.wa-guide-body{padding:16px}
.step-item{display:flex;gap:12px;margin-bottom:14px;align-items:flex-start}
.step-num{width:28px;height:28px;min-width:28px;border-radius:50%;
  background:linear-gradient(135deg,var(--lake),var(--reed));
  color:#fff;font-size:13px;font-weight:800;
  display:flex;align-items:center;justify-content:center}
.step-text{font-size:13px;color:#0f172a;line-height:1.5}
.step-text b{color:var(--lake)}
.copy-btn{width:100%;padding:13px;border-radius:12px;
  background:var(--moon);border:1.5px solid var(--lake);
  color:var(--lake);font-size:13px;font-weight:700;cursor:pointer;
  margin-top:6px;transition:all .2s;font-family:'Inter',system-ui}
.copy-btn:active{background:var(--lake);color:#fff}
.nums-box{background:var(--moon);border-radius:8px;padding:12px;
  font-size:12px;font-family:'DM Mono',monospace;color:#0f172a;
  line-height:1.8;margin-top:8px;max-height:120px;overflow-y:auto;
  display:none;word-break:break-all}
.send-all-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.swa-btn{padding:15px;border-radius:12px;background:#25D366;color:#fff;
  border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:'Inter',system-ui}
.ssm-btn{padding:15px;border-radius:12px;background:var(--sky);color:#fff;
  border:none;font-size:14px;font-weight:700;cursor:pointer;font-family:'Inter',system-ui}
.send-note{font-size:11px;color:#94a3b8;text-align:center;margin-bottom:12px;line-height:1.5}
.bc-list{background:#fff;border-radius:14px;border:1px solid var(--pebble);overflow:hidden;margin-bottom:14px}
.bc-list-hd{padding:12px 16px;background:var(--moon);border-bottom:1px solid var(--pebble);
  font-size:11px;font-weight:700;color:var(--dusk);text-transform:uppercase;letter-spacing:.8px}
.bc-row{display:flex;align-items:center;justify-content:space-between;
  padding:13px 16px;border-bottom:1px solid #f8fafc}
.bc-row:last-child{border:none}
.bc-rname{font-size:14px;font-weight:700;color:#0f172a}
.bc-rphone{font-size:11px;color:#94a3b8;margin-top:2px}
.bc-wa{padding:8px 12px;border-radius:8px;background:#dcfce7;color:#15803d;
  border:none;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;margin-right:6px}
.bc-sms{padding:8px 12px;border-radius:8px;background:#dbeafe;color:#1d4ed8;
  border:none;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none}
.bc-sent{font-size:11px;font-weight:700;color:#15803d;padding:5px 10px;
  background:#dcfce7;border-radius:8px}

/* ── PRO CARD ── */
.pro-card{
  background:linear-gradient(135deg,var(--forest) 0%,var(--lake) 70%,var(--reed) 100%);
  border-radius:20px;padding:24px;color:#fff;position:relative;
  overflow:hidden;border:1px solid rgba(16,185,129,.25);margin-bottom:16px}
.pro-badge{background:linear-gradient(135deg,var(--gold),var(--gold-l));
  border-radius:20px;padding:4px 14px;font-size:11px;font-weight:800;
  display:inline-block;margin-bottom:12px;color:#fff}
.pro-title{font-size:18px;font-weight:900;margin-bottom:6px;
  font-family:'Playfair Display',Georgia,serif}
.pro-sub{font-size:13px;opacity:.85;margin-bottom:16px;line-height:1.6}
.pro-feat{list-style:none;margin-bottom:18px}
.pro-feat li{font-size:13px;margin-bottom:8px;padding-left:28px;position:relative;opacity:.9}
.pro-feat li::before{content:"✓";position:absolute;left:0;
  background:rgba(16,185,129,.25);border:1px solid rgba(16,185,129,.4);
  border-radius:50%;width:19px;height:19px;display:inline-flex;
  align-items:center;justify-content:center;font-size:10px;font-weight:800}
.pro-cta{background:linear-gradient(135deg,var(--gold),var(--gold-l));
  color:#fff;border:none;border-radius:12px;padding:14px;width:100%;
  font-size:14px;font-weight:800;cursor:pointer;font-family:'Inter',system-ui}

/* ══════════════════════════════════════════
   DESKTOP ENHANCEMENTS (≥ 901px)
══════════════════════════════════════════ */
@media(min-width:901px){
  body{background:var(--moon)}
  .mobile-only{display:none!important}
  .desk-only{display:block}
  .mob-tabs{display:none!important}

  /* Sidebar */
  .sidebar{
    display:flex;flex-direction:column;
    width:var(--sidebar);min-width:var(--sidebar);
    background:linear-gradient(180deg,var(--forest) 0%,var(--lake) 100%);
    position:fixed;top:0;left:0;bottom:0;z-index:20;
    box-shadow:4px 0 24px rgba(0,0,0,.18);
  }
  .sidebar-logo{padding:22px 18px 18px;border-bottom:1px solid rgba(255,255,255,.1)}
  .sidebar-logo-inner{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .sidebar-title{font-family:'Playfair Display',Georgia,serif;font-size:18px;
    font-weight:900;color:#fff;line-height:1}
  .sidebar-title span{color:var(--gold)}
  .sidebar-badge{font-size:10px;color:#6ee7b7;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
  .sidebar-biz-code{font-size:10px;color:#6ee7b7;font-weight:700;letter-spacing:2px;
    font-family:'DM Mono',monospace;margin-bottom:3px}
  .sidebar-biz-name{font-size:14px;font-weight:900;color:#fff;
    font-family:'Playfair Display',Georgia,serif;line-height:1.2}
  .sidebar-biz-type{font-size:11px;color:rgba(167,243,208,.75);margin-top:2px}
  .sidebar-qs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;
    padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
  .sidebar-qs-box{background:rgba(255,255,255,.1);border-radius:8px;padding:8px 4px;text-align:center}
  .sidebar-qs-val{font-size:16px;font-weight:900;color:#fff;
    font-family:'Inter',system-ui;font-variant-numeric:tabular-nums}
  .sidebar-qs-lbl{font-size:9px;color:#6ee7b7;font-weight:600;margin-top:2px;letter-spacing:.5px}
  .sidebar-nav{flex:1;padding:14px 10px;overflow-y:auto}
  .nav-btn{display:flex;align-items:center;gap:10px;width:100%;
    padding:11px 12px;border-radius:10px;border:none;background:none;
    color:rgba(255,255,255,.6);font-size:13px;font-weight:600;cursor:pointer;
    transition:all .18s;text-align:left;margin-bottom:4px;font-family:'Inter',system-ui}
  .nav-btn:hover{background:rgba(255,255,255,.1);color:#fff}
  .nav-btn.on{background:rgba(255,255,255,.15);color:#fff;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
  .nav-btn .ni{font-size:18px;width:24px;text-align:center}
  .sidebar-footer{padding:14px;border-top:1px solid rgba(255,255,255,.1)}
  .sidebar-logout{width:100%;padding:10px;border-radius:9px;
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);
    color:rgba(255,255,255,.8);font-size:12px;font-weight:600;cursor:pointer;
    font-family:'Inter',system-ui}
  .sidebar-logout:hover{background:rgba(255,255,255,.18);color:#fff}

  /* Main layout */
  .app-shell{margin-left:var(--sidebar);display:flex;flex-direction:column;min-height:100vh}

  /* Topbar */
  .topbar{background:#fff;border-bottom:1px solid var(--pebble);
    padding:16px 32px;display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:10;box-shadow:0 2px 12px rgba(0,0,0,.06)}

<script>


const SB=window.supabase.createClient("https://ypwmlgvgssdkicrlkhii.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlwd21sZ3Znc3Nka2ljcmxraGlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzNjg0ODgsImV4cCI6MjA5MTk0NDQ4OH0.8U1rsJ4RsUUiMPLWC2cHx9pcZgmpQXDjqdPGppVudq8");
let BIZ=null,CUSTS=[],TXNS=[];

async function doLogin(){
  const phone=document.getElementById("iphone").value.trim();
  const code=document.getElementById("icode").value.trim().toUpperCase();
  const msg=document.getElementById("msg");
  if(!phone||!code){msg.style.color="#ef4444";msg.textContent="Jaza namba na code.";return;}
  msg.style.color="#f59e0b";msg.textContent="Inakagua...";
  try{
    const{data,error}=await SB.from("businesses").select("*").eq("phone",phone).eq("code",code).single();
    if(error||!data){msg.style.color="#ef4444";msg.textContent="Haikupatikana. Angalia namba na code.";return;}
    msg.style.color="#10b981";msg.textContent="✅ Inafungua dashboard...";
    BIZ=data;localStorage.setItem("m_session",JSON.stringify({phone,code}));
    setTimeout(showApp,600);
  }catch(e){msg.style.color="#ef4444";msg.textContent=e.message;}
}

function doLogout(){localStorage.removeItem("m_session");location.reload();}

function showApp(){
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="block";
  document.getElementById("hcode").textContent=BIZ.code;
  document.getElementById("hname").textContent=BIZ.name||"My Business";
  document.getElementById("htype").textContent=(BIZ.type||"")+" · Since "+new Date(BIZ.created_at).toLocaleDateString("en-KE",{month:"short",year:"numeric"});
  loadAll();
}

async function loadAll(){
  const p=BIZ.phone,wk=new Date(Date.now()-7*86400000).toISOString();
  const[cr,tr]=await Promise.all([
    SB.from("customers").select("*").eq("business_phone",p).order("total_spent",{ascending:false}),
    SB.from("transactions").select("*").eq("business_phone",p).order("created_at",{ascending:false}).limit(50)
  ]);
  CUSTS=cr.data||[];TXNS=tr.data||[];
  const wkRev=TXNS.filter(t=>t.created_at>wk).reduce((s,t)=>s+t.amount,0);
  const ov=CUSTS.filter(c=>Math.floor((Date.now()-new Date(c.last_visit))/86400000)>=18);
  // Mobile header stats
  document.getElementById("qr").textContent="Ksh "+wkRev.toLocaleString();
  document.getElementById("qc").textContent=CUSTS.length;
  document.getElementById("qf").textContent=ov.length;
  // Sidebar stats (desktop)
  const sqr=document.getElementById("sqr"); if(sqr)sqr.textContent="Ksh "+wkRev.toLocaleString();
  const sqc=document.getElementById("sqc"); if(sqc)sqc.textContent=CUSTS.length;
  const sqf=document.getElementById("sqf"); if(sqf)sqf.textContent=ov.length;
  // Topbar subtitle
  const tbs=document.getElementById("tbarSub");
  if(tbs)tbs.textContent=BIZ.name+" · "+CUSTS.length+" customers · Ksh "+wkRev.toLocaleString()+" this week";
  drawOv(wkRev,ov);drawCu();drawTx();drawFu(ov);drawBc();
}

function drawOv(wkRev,ov){
  const tot=TXNS.reduce((s,t)=>s+t.amount,0);
  const avg=TXNS.length?Math.round(tot/TXNS.length):0;
  const pts=CUSTS.reduce((s,c)=>s+c.total_points,0);
  document.getElementById("pov").innerHTML=`
    <div class="stat-grid">
      <div class="stat-card" style="--c:#065F46"><div class="stat-lbl">Total Revenue</div><div class="stat-val">Ksh ${tot.toLocaleString()}</div><div class="stat-sub">↑ Ksh ${wkRev.toLocaleString()} wiki hii</div></div>
      <div class="stat-card" style="--c:#0ea5e9"><div class="stat-lbl">Total Sales</div><div class="stat-val">${TXNS.length}</div><div class="stat-sub">Wastani Ksh ${avg.toLocaleString()}</div></div>
      <div class="stat-card" style="--c:#D97706"><div class="stat-lbl">Wateja</div><div class="stat-val">${CUSTS.length}</div><div class="stat-sub">${ov.length} wanahitaji follow-up</div></div>
      <div class="stat-card" style="--c:#8b5cf6"><div class="stat-lbl">Loyalty Points</div><div class="stat-val">${pts}</div><div class="stat-sub">Zawadi za uaminifu</div></div>
    </div>
    <div class="grid-2-col">
    <div class="card"><div class="card-title">🏆 Wateja Bora</div>
      ${CUSTS.slice(0,3).map((c,i)=>`<div class="row"><div><div class="rn">${["🥇","🥈","🥉"][i]} ${c.name}</div><div class="ri">${c.visit_count} ziara · ${c.total_points} pts</div></div><div class="ra">Ksh ${c.total_spent.toLocaleString()}</div></div>`).join("")||"<div class='empty'>Hakuna wateja bado.</div>"}
    </div>
    <div class="card"><div class="card-title">⚡ Mauzo ya Hivi Karibuni</div>
      ${TXNS.slice(0,4).map(t=>`<div class="row"><div><div class="rn">${t.customer_name}</div><div class="ri">${t.item||"—"} · ${new Date(t.created_at).toLocaleDateString("en-KE")}</div></div><div style="text-align:right"><div class="ra">Ksh ${t.amount.toLocaleString()}</div><div class="rp">+${t.points_awarded} pts</div></div></div>`).join("")||"<div class='empty'>Hakuna mauzo bado.</div>"}
    </div>`;
}

function drawCu(q){
  q=q||"";
  const list=CUSTS.filter(c=>c.name.toLowerCase().includes(q.toLowerCase())||(c.phone||"").includes(q));
  document.getElementById("pcu").innerHTML=`
    <input class="srch" placeholder="🔍 Tafuta jina au namba..." oninput="drawCu(this.value)" value="${q}"/>
    ${list.map(c=>{
      const d=Math.floor((Date.now()-new Date(c.last_visit))/86400000);
      const[bc,tc,lbl]=c.total_spent>5000?["#fef3c7","#92400e","⭐ VIP"]:d>=21?["#fee2e2","#991b1b","⚠ Muda"]:["#d1fae5","#065f46","● Active"];
      const raw=c.phone||"";
      const wa=raw.startsWith("254")?raw:"254"+raw.replace(/^0/,"");
      const fn=encodeURIComponent(c.name.split(" ")[0]);
      return `<div class="ccard" style="border-left:4px solid ${tc}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div><div class="cname">${c.name}</div><div class="cphone">📞 ${raw||"—"}</div></div>
          <span class="badge" style="background:${bc};color:${tc}">${lbl}</span>
        </div>
        <div class="cgrid">

const TMPLS=[

  {id:"thanks",lbl:"🙏 Asante",msg:"Asante sana {name}! 🌟\nTunashukuri sana ujio wako.\n⭐ Una pointi {pts} — karibu tena!\n— {biz}"},
  {id:"miss",lbl:"💔 Kukosa",msg:"Habari {name}! 😊\nTumekukosa sana!\nKuja ututembelee, tuna mambo mapya. 🎁\n— {biz}"},
  {id:"points",lbl:"⭐ Points",msg:"Habari {name}! 🌟\nUna *{pts} loyalty points* kwa {biz}!\nKuja uzitumie leo ⏰"},
  {id:"event",lbl:"🎊 Tukio",msg:"Habari {name}! 🎊\n[Andika habari yako hapa]\n\nKaribu! — {biz}"},

];
let selTpl="promo",sentSet=new Set(),numsVisible=false;
function bldMsg(raw,c){const fn=(c&&c.name?c.name:"Mteja").split(" ")[0];return raw.replace(/{name}/g,fn).replace(/{pts}/g,c?c.total_points:0).replace(/{biz}/g,BIZ?BIZ.name:"Sisi");}
function getMsgTxt(){return document.getElementById("bcTxt")?document.getElementById("bcTxt").value:TMPLS.find(t=>t.id===selTpl).msg;}
function updatePreview(){const raw=getMsgTxt(),first=CUSTS.find(c=>c.phone)||CUSTS[0];const el=document.getElementById("bcPreview");if(el)el.innerHTML=bldMsg(raw,first).replace(/\*([^*]+)\*/g,"<b>$1</b>").replace(/\n/g,"<br>");}
function pickTpl(id){selTpl=id;const ta=document.getElementById("bcTxt");if(ta)ta.value=TMPLS.find(t=>t.id===id).msg;document.querySelectorAll(".tpl-pill").forEach(p=>p.classList.toggle("sel",p.dataset.id===id));updatePreview();}
function toggleNums(){numsVisible=!numsVisible;const box=document.getElementById("numsBox");if(box)box.style.display=numsVisible?"block":"none";const btn=document.getElementById("showNumsBtn");if(btn)btn.textContent=numsVisible?"▲ Ficha Namba":"📋 Onyesha Namba Zote";}
function copyNums(){const nums=CUSTS.filter(c=>c.phone).map(c=>{const r=c.phone.replace(/\s+/g,"");return r.startsWith("254")?"0"+r.slice(3):r;}).join("\n");navigator.clipboard.writeText(nums).then(()=>{const b=document.getElementById("copyNumsBtn");if(b){const o=b.textContent;b.textContent="✅ Imenakiliwa!";setTimeout(()=>b.textContent=o,2500);}}).catch(()=>{alert("Long-press the numbers box to copy manually.");});}
let sendIdx=0;
function sendAllNow(type){const wp=CUSTS.filter(c=>c.phone);if(!wp.length)return;sendIdx=0;function next(){if(sendIdx>=wp.length)return;const c=wp[sendIdx];const wa=c.phone.startsWith("254")?c.phone:"254"+c.phone.replace(/^0/,"");const msg=bldMsg(getMsgTxt(),c);window.open(type==="wa"?`https://wa.me/${wa}?text=${encodeURIComponent(msg)}`:`sms:${c.phone}?body=${encodeURIComponent(msg)}`,"_blank");sentSet.add(c.phone);sendIdx++;const btn=document.getElementById("brbtn"+c.id);if(btn)btn.innerHTML='<span class="bc-sent">✓ Imetumwa</span>';if(sendIdx<wp.length)setTimeout(next,1800);}next();}
function sendOneNow(type,custId,dest){const c=CUSTS.find(x=>String(x.id)===String(custId));const wa=dest.startsWith("254")?dest:"254"+dest.replace(/^0/,"");const msg=bldMsg(getMsgTxt(),c);window.open(type==="wa"?`https://wa.me/${wa}?text=${encodeURIComponent(msg)}`:`sms:${dest}?body=${encodeURIComponent(msg)}`,"_blank");sentSet.add(dest);const btn=document.getElementById("brbtn"+custId);if(btn)btn.innerHTML='<span class="bc-sent">✓ Imetumwa</span>';}

function go(id,btn){
  ["ov","cu","tx","fu","bc"].forEach(x=>document.getElementById("p"+x).style.display=x===id?"block":"none");

window.addEventListener("load",async()=>{
  const s=localStorage.getItem("m_session");if(!s)return;
  try{const{phone,code}=JSON.parse(s);const{data,error}=await SB.from("businesses").select("*").eq("phone",phone).eq("code",code).single();
  if(data&&!error){BIZ=data;showApp();}else localStorage.removeItem("m_session");}
  catch(e){localStorage.removeItem("m_session");}
});


// Sync sidebar + mobile header IDs
function syncHeaders(){
  if(!BIZ)return;
  ["sCode","mCode"].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=BIZ.code;});
  ["sName","mName"].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=BIZ.name||"My Business";});
  ["sType","mType"].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=(BIZ.type||"")+" · Since "+new Date(BIZ.created_at).toLocaleDateString("en-KE",{month:"short",year:"numeric"});});
}

const PAGE_LABELS={ov:"Overview",cu:"Customers",tx:"Sales",fu:"Follow-ups",bc:"Broadcast"};
const PAGE_SUBS={
  ov:"Your week at a glance",
  cu:"All registered customers",
  tx:"Complete sales ledger",
  fu:"Customers to contact today",
  bc:"Send messages to all customers"
};

// Override go() to also update topbar and sidebar nav
const _go = go;
function go(id,btn){
  // Pages
  ["ov","cu","tx","fu","bc"].forEach(x=>{
    const el=document.getElementById("p"+x);
    if(el)el.style.display=x===id?"block":"none";
    if(el)el.className=x===id?"page on":"page";
  });
  // Sidebar nav
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("on"));
  document.querySelectorAll(".tab").forEach(b=>b.classList.remove("on"));
  if(btn){
    btn.classList.add("on");
    // Sync the other nav (mobile tab or sidebar)
    const isSidebar=btn.classList.contains("nav-btn");
    const isTab=btn.classList.contains("tab");
    const allBtns=[...document.querySelectorAll(isSidebar?".tab":".nav-btn")];
    const pages=["ov","cu","tx","fu","bc"];
    const idx=pages.indexOf(id);
    if(allBtns[idx])allBtns[idx].classList.add("on");
  }
  // Topbar label
  const t=document.getElementById("tbarTitle");
  const s=document.getElementById("tbarSub");
  if(t)t.textContent=PAGE_LABELS[id]||"";
  if(s)s.textContent=PAGE_SUBS[id]||"";
}

// Override showApp to also sync headers
const _showApp = showApp;
function showApp(){

  document.getElementById("app").style.display="block";

}



// ── SYNC ALL HEADERS ─────────────────────────────────
function syncHeaders() {
  if (!BIZ) return;
  const code = BIZ.code || "";
  const name = BIZ.name || "My Business";
  const since = new Date(BIZ.created_at).toLocaleDateString("en-KE",{month:"short",year:"numeric"});
  const type = (BIZ.type || "") + " · Since " + since;

  // Mobile
  const mc=document.getElementById("mCode"); if(mc) mc.textContent=code;
  const mn=document.getElementById("mName"); if(mn) mn.textContent=name;
  const mt=document.getElementById("mType"); if(mt) mt.textContent=type;

  // Sidebar (desktop)
  const sc=document.getElementById("sdCode"); if(sc) sc.textContent=code;
  const sn=document.getElementById("sdName"); if(sn) sn.textContent=name;
  const st=document.getElementById("sdType"); if(st) st.textContent=type;
}

// ── SYNC STATS ───────────────────────────────────────
function syncStats(wkRev, custLen, ovLen) {
  // Mobile
  const qr=document.getElementById("qr"); if(qr) qr.textContent="Ksh "+wkRev.toLocaleString();
  const qc=document.getElementById("qc"); if(qc) qc.textContent=custLen;
  const qf=document.getElementById("qf"); if(qf) qf.textContent=ovLen;
  // Sidebar
  const sr=document.getElementById("sdqR"); if(sr) sr.textContent="Ksh "+wkRev.toLocaleString();
  const sc=document.getElementById("sdqC"); if(sc) sc.textContent=custLen;
  const sf=document.getElementById("sdqF"); if(sf) sf.textContent=ovLen;
  // Topbar
  const ts=document.getElementById("tbarSub");
  if(ts && BIZ) ts.textContent=BIZ.name+" · "+custLen+" wateja · Ksh "+wkRev.toLocaleString()+" wiki hii";
}

// ── OVERRIDE showApp ─────────────────────────────────
const _origShowApp = showApp;
function showApp() {
  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display = "block";
  syncHeaders();
  loadAll();
}

// ── OVERRIDE go() — sync both navbars ────────────────
const PAGE_LABELS = {ov:"📊 Overview",cu:"👥 Customers",tx:"💰 Sales",fu:"🔔 Follow-ups",bc:"📢 Broadcast"};
const PAGE_SUBS   = {ov:"Wiki yako kwa muhtasari",cu:"Wateja wote",tx:"Mauzo yote",fu:"Wateja wa kuwasiliana",bc:"Tuma ujumbe kwa wote"};

function go(id, btn) {
  // Show correct page
  ["ov","cu","tx","fu","bc"].forEach(x => {
    const el = document.getElementById("p"+x);
    if (el) { el.className = x===id ? "page on" : "page"; }
  });
  // Active nav-btn (sidebar)
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("on"));
  // Active mob-tab
  document.querySelectorAll(".mob-tab").forEach(b => b.classList.remove("on"));
  if (btn) {
    btn.classList.add("on");
    const pages = ["ov","cu","tx","fu","bc"];
    const idx = pages.indexOf(id);
    // Sync the other set
    if (btn.classList.contains("nav-btn")) {
      const tabs = document.querySelectorAll(".mob-tab");
      if (tabs[idx]) tabs[idx].classList.add("on");
    } else {
      const btns = document.querySelectorAll(".nav-btn");
      if (btns[idx]) btns[idx].classList.add("on");
    }
  }
  // Topbar
  const tt=document.getElementById("tbarTitle"); if(tt) tt.textContent=PAGE_LABELS[id]||"";
  const ts=document.getElementById("tbarSub");
  if(ts) ts.textContent=PAGE_SUBS[id]||"";
  // Scroll to top on mobile
  window.scrollTo({top:0,behavior:"smooth"});
}

// ── PATCH loadAll to call syncStats ─────────────────
const _origLoadAll = loadAll;
async function loadAll() {
  const p=BIZ.phone, wk=new Date(Date.now()-7*86400000).toISOString();
  const[cr,tr]=await Promise.all([
    SB.from("customers").select("*").eq("business_phone",p).order("total_spent",{ascending:false}),
    SB.from("transactions").select("*").eq("business_phone",p).order("created_at",{ascending:false}).limit(50)
  ]);
  CUSTS=cr.data||[]; TXNS=tr.data||[];
  const wkRev=TXNS.filter(t=>t.created_at>wk).reduce((s,t)=>s+t.amount,0);
  const ov=CUSTS.filter(c=>Math.floor((Date.now()-new Date(c.last_visit))/86400000)>=18);
  syncStats(wkRev, CUSTS.length, ov.length);
  drawOv(wkRev,ov); drawCu(); drawTx(); drawFu(ov); drawBc();
}
</script>
